<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harmonio – Gehörbildungstraining: Intervalle, Akkorde und Diktate" />
    <meta name="theme-color" content="#1f3a5f" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Harmonio</title>
    <script>
      // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen)
      try {
        var s = JSON.parse(localStorage.getItem('harmonio:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
